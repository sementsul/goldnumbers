<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой PWA</title>

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Иконки для разных устройств -->
    <link rel="icon" href="icons/icon-192x192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
            color: #333;
        }
        h1 {
            color: #007bff;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Добро пожаловать в мой PWA!</h1>
    <p>Это пример простого Progressive Web App, который можно установить на ваше устройство.</p>

    <div id="installContainer">
        <p>Установите приложение для быстрого доступа и работы оффлайн.</p>
        <button id="installBtn">Установить PWA</button>
    </div>

    <div id="status"></div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        const statusDiv = document.getElementById('status');

        // Скрываем кнопку установки, если браузер не поддерживает PWA
        if (!('serviceWorker' in navigator)) {
            statusDiv.textContent = 'Ваш браузер не поддерживает Service Workers.';
            installBtn.style.display = 'none';
        } else {
            // Регистрируем Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('Service Worker зарегистрирован:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('Ошибка регистрации Service Worker:', error);
                    });
            }

            // Обработка события beforeinstallprompt
            window.addEventListener('beforeinstallprompt', (e) => {
                // Отменяем стандартное окно установки
                e.preventDefault();
                // Сохраняем событие, чтобы показать его позже
                deferredPrompt = e;
                // Показываем кнопку установки
                installBtn.style.display = 'block';
                statusDiv.textContent = 'Нажмите "Установить PWA", чтобы добавить приложение на главный экран.';
            });

            // Обработка нажатия на кнопку установки
            installBtn.addEventListener('click', () => {
                // Скрываем кнопку установки
                installBtn.style.display = 'none';
                statusDiv.textContent = 'Приложение устанавливается...';
                // Показываем стандартное окно установки
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    // Ждем ответа пользователя
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('Пользователь установил приложение.');
                            statusDiv.textContent = 'Приложение успешно установлено!';
                        }

else {
                            console.log('Пользователь отклонил установку.');
                            statusDiv.textContent = 'Установка отклонена.';
                        }
                        deferredPrompt = null; // Сбрасываем, чтобы его нельзя было вызвать повторно
                    });
                }
            });

            // Обработка события appinstalled
            window.addEventListener('appinstalled', () => {
                console.log('Приложение было установлено.');
                statusDiv.textContent = 'Приложение успешно установлено!';
                deferredPrompt = null;
            });
        }
    </script>

    <!-- Здесь будет находиться ваш Service Worker.
         В реальном проекте он будет в отдельном файле sw.js -->
    <script>
        // Этот скрипт имитирует содержимое файла sw.js для демонстрации.
        // В реальном проекте вам нужно будет создать файл sw.js
        // и поместить туда код Service Worker.

        // Пример содержимого sw.js:
        const CACHE_NAME = 'my-pwa-cache-v1';
        const urlsToCache = [
            '/',
            '/index.html',
            '/icons/icon-192x192.png',
            '/icons/apple-touch-icon.png'
            // Добавьте сюда другие ресурсы, которые хотите кешировать
        ];

        self.addEventListener('install', event => {
            event.waitUntil(
                caches.open(CACHE_NAME)
                    .then(cache => {
                        console.log('Кэш открыт');
                        return cache.addAll(urlsToCache);
                    })
            );
        });

        self.addEventListener('fetch', event => {
            event.respondWith(
                caches.match(event.request)
                    .then(response => {
                        if (response) {
                            return response;
                        }
                        return fetch(event.request);
                    })
            );
        });

        self.addEventListener('activate', event => {
            const cacheWhitelist = [CACHE_NAME]; // Перечислите все кэши, которые хотите сохранить
            event.waitUntil(
                caches.keys().then(cacheNames => {
                    return Promise.all(
                        cacheNames.map(cacheName => {
                            if (cacheWhitelist.indexOf(cacheName) === -1) {
                                return caches.delete(cacheName); // Удаляем старые кэши
                            }
                        })
                    );
                })
            );
        });
    </script>

</body>
</html>

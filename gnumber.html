<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Купить красные телефонные номера</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #800000; /* Темно-красный бархатный фон */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .banner-container {
            width: 80%;
            max-width: 600px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5); /* Полупрозрачный черный для контраста */
            border: 10px solid gold; /* Золотая рамка */
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px gold; /* Золотая тень */
        }
        .banner-text {
            color: gold;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .button {
            background-color: gold;
            color: #800000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .button:hover {
            background-color: #FFD700; /* Светлее золота при наведении */
        }
        .seo-text {
            color: #FFD700;
            font-size: 10px;
            margin-top: 20px;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <h1 class="banner-text">Купите красивый телефонный номер сегодня!</h1>
        <p class="banner-text">Премиум номера: от простых мемориалов до VIP-комбинаций. Идеально для бизнеса или личного использования. Доставка по всей стране!</p>
        <button class="button" onclick="alert('Спасибо за интерес! Свяжитесь с нами для покупки.')">Купить сейчас</button>
        <div class="seo-text">
            Автор проекта менеджер по продажам компании Безлимит, Семенцул Максим.
Услуги связи оказывает ООО Безлимит.
        </div>
    </div>
</body>
</html>

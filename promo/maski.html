<!DOCTYPE html>
<html>
<head>
<title>MS-DOS Number Picker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background-color: #000080; /* Синий фон */
  color: #00FF00; /* Зеленый текст */
  font-family: monospace;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 80%;
  max-width: 600px;
  padding: 20px;
  border: 1px dashed #00FF00;
  text-align: center;
}

h1 {
  font-size: 2em;
  margin-bottom: 10px;
}

label {
  display: block;
  margin-bottom: 5px;
}

input[type="text"] {
  background-color: #000000;
  color: #00FF00;
  border: 1px solid #00FF00;
  font-family: monospace;
  padding: 5px;
  width: 100%;
  box-sizing: border-box; /* Важно для правильной ширины */
  margin-bottom: 10px;
}

button {
  background-color: #000000;
  color: #00FF00;
  border: 1px solid #00FF00;
  font-family: monospace;
  padding: 5px 10px;
  cursor: pointer;
}

#results {
  margin-top: 20px;
  font-size: 0.9em;
}

#example-numbers {
  margin-top: 20px;
  font-style: italic;
  font-size: 0.8em;
}
</style>
</head>
<body>

<div class="container">
  <h1>MS-DOS Number Picker</h1>

  <label for="prefix">Prefix:</label>
  <input type="text" id="prefix" placeholder="e.g., 555">

  <label for="length">Length:</label>
  <input type="text" id="length" placeholder="e.g., 7" value="7">

  <button onclick="generateNumbers()">Generate Numbers</button>

  <div id="results"></div>

  <div id="example-numbers">
    <b>Example Numbers:</b><br>
    555-123-4567<br>
    987-654-3210<br>
    123-456-7890<br>
    555-999-8888<br>
    111-222-3333
  </div>
</div>

<script>
function generateNumbers() {
  const prefix = document.getElementById("prefix").value;
  const length = parseInt(document.getElementById("length").value);
  const resultsDiv = document.getElementById("results");

  if (isNaN(length) || length <= 0) {
    resultsDiv.textContent = "Invalid length. Please enter a positive number.";
    return;
  }

  let numbers = [];
  for (let i = 0; i < 10; i++) { // Generate 10 numbers
    let randomNumber = Math.floor(Math.random() * (10 Ⓑ (length - prefix.length))).toString().padStart(length - prefix.length, '0');
    numbers.push(prefix + randomNumber);
  }

  let output = "Generated Numbers:<br>";
  numbers.forEach(number => {
    output += number + "<br>";
  });

  resultsDiv.innerHTML = output;
}
</script>

</body>
</html>

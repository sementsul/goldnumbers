<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Золотые Кнопки с Видеофоном</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="video-background">
        <video autoplay muted loop id="bg-video">
            <!-- Замените 'your-video.mp4' на путь к вашему видеофайлу -->
            <source src="your-video.mp4" type="video/mp4">
            Ваш браузер не поддерживает воспроизведение видео.
        </video>
    </div>

    <div class="content">
        <h1>Добро пожаловать!</h1>
        <p>Нажмите на одну из наших золотых кнопок:</p>

        <button class="gold-button">Кнопка 1</button>
        <button class="gold-button">Кнопка 2</button>
        <button class="gold-button">Кнопка 3</button>
    </div>

</body>
</html>

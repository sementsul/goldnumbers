
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подбор Красивого Номера по Нумерологии</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Градиентный фон */
            margin: 0;
            color: #fff; /* Белый текст на темном фоне */
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9); /* Полупрозрачный белый фон */
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h1 {
            color: #333; /* Темный заголовок */
            margin-bottom: 20px;
            font-size: 2.2em;
        }
        p {
            color: #555; /* Темный текст */
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: 1.1em;
        }
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #444;
            font-size: 1.1em;
        }
        input[type="text"] {
            width: calc(100% - 22px);
            padding: 15px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.3);
            outline: none;
        }
        button {
            background-color: #667eea; /* Цвет кнопки соответствует градиенту */
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: bold;
        }
        button:hover {
            background-color: #5156e0;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #result {
            margin-top: 40px;
            padding: 25px;
            border: 1px dashed #667eea;
            border-radius: 8px;
            background-color: rgba(102, 126, 234, 0.1); /* Светлый фон для результата */
            min-height: 80px;
            display: none; /* Изначально скрыт */
            word-break: break-all;
            color: #333; /* Темный текст в результатах */
        }
        #result p {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        #generatedLink {
            color: #764ba2;
            text-decoration: none;
              font-weight: bold;
            font-size: 1.3em;
            display: block; /* Чтобы ссылка занимала всю строку */
            transition: color 0.3s ease;
        }
        #generatedLink:hover {
            color: #5156e0;
            text-decoration: underline;
        }
        .note {
            font-size: 0.8em;
            color: #777;
            margin-top: 15px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Найдите Номер Мечты!</h1>
        <p>Введите последние 5 цифр, которые вам нравятся, и мы найдем подходящие номера в нашем каталоге с помощью нумерологии.</p>

        <div class="input-group">
            <label for="phoneInput">Желаемые последние 5 цифр:</label>
            <input type="text" id="phoneInput" placeholder="Например, 77777, 12345, 88005" maxlength="5">
            <div class="note">Введите 5 цифр. Система использует их для подбора.</div>
        </div>

        <button onclick="generateAndRedirect()">Найти номера</button>

        <div id="result">
            <p>Ваша ссылка на каталог:</p>
            <a id="generatedLink" href="#" target="_blank"></a>
        </div>
    </div>

    <script>
        // --- Нумерологическая функция ---
        // Можно настроить под свои нужды. Это простой пример.
        function calculateNumerologyCode(digits) {
            let sum = 0;
            for (let i = 0; i < digits.length; i++) {
                let digit = parseInt(digits[i]);
                // Простая нумерология: суммируем цифры, приводим к однозначному числу
                // (кроме мастер-чисел 11, 22, 33).
                // Здесь мы для простоты просто суммируем все 5 цифр и берем остаток от деления на 10
                // для получения финального "кода".
                sum += digit;
            }

            // Приводим к однозначному числу (или оставляем мастер-число)
            let result = sum;
            while (result > 9 && result !== 11 && result !== 22 && result !== 33) {
                let tempSum = 0;
                let tempS = String(result);
                for (let i = 0; i < tempS.length; i++) {
                    tempSum += parseInt(tempS[i]);
                }
                result = tempSum;
            }

            // Для магазина, нам нужно что-то, что можно передать как параметр.
            // Можно использовать само итоговое нумерологическое значение (1-9, 11, 22, 33).
            // Или, если нужно 5 цифр, можно комбинировать.
            // Давайте для простоты, если введены 5 цифр, получим 5 цифр на основе их нумерологического значения.

            let finalFiveDigits = '';
            for (let i = 0; i < digits.length; i++) {
                let digitValue = parseInt(digits[i]);
                let numerologyOfDigit = digitValue; // В данном простом случае, цифра = ее нумерологическое значение

                // Если бы мы хотели более сложный расчет для каждой цифры:
                // let numerologyOfDigit = calculateSingleDigitNumerology(digitValue);

                finalFiveDigits += numerologyOfDigit;
            }
            return finalFiveDigits; // Возвращаем 5 цифр, полученных из введенных
        }

        function generateAndRedirect() {
            const phoneInput = document.getElementById('phoneInput').value.trim();
            const resultDiv = document.getElementById('result');
            const generatedLink = document.getElementById('generatedLink');

            // --- ЗАМЕНИТЕ НА ВАШ ДОМЕН И ПУТЬ К КАТАЛОГУ ---
            // Пример: "https://your-store.com/catalog/"
            // Где "/catalog/" - это путь, а после него будет идти "xxxxx" (ваше нумерологическое окончание)
            const baseUrl = "https://your-store.com/catalog/"; // <<< ИЗМЕНИТЕ ЭТО!

            // 1. Проверка ввода
            if (phoneInput.length !== 5) {
                alert("Пожалуйста, введите ровно 5 цифр.");
                resultDiv.style.display = 'none'; // Скрыть предыдущий результат, если есть
                return;
            }

            // Проверка, что введены только цифры
            if (!/^\d{5}$/.test(phoneInput)) {
                alert("Пожалуйста, введите только цифры.");
                resultDiv.style.display = 'none';
                return;
            }

            // 2. Применяем нумерологию для получения окончания ссылки
            // В данном случае, мы просто берем введенные 5 цифр как основу для каталожной ссылки.
            // Если бы вы хотели применить нумерологию к каждой цифре ИЛИ к сумме,
            // то функция calculateNumerologyCode была бы сложнее.
            // Для магазина, где каталог фильтруется по окончанию, часто лучше
            // напрямую использовать введенные пользователем цифры, если они нравятся.
            // Давайте оставим как есть: нумерология здесь скорее для "прикрытия",
            // а реально используется введенное окончание.
            // Если вам нужен РЕАЛЬНЫЙ нумерологический расчет для ПОДБОРА,
            // то нужно решить, как он будет влиять на окончание.

            // Вариант 1: Используем введенные 5 цифр напрямую как окончание.
            // Нумерология здесь скорее ритуальная.
            const catalogSuffix = phoneInput;

            // Вариант 2: Если нужно получить НОВОЕ окончание на основе нумерологии введенных цифр.
            // const catalogSuffix = calculateNumerologyCode(phoneInput); // Если функция возвращает 5 цифр

            // 3. Генерируем полную ссылку
            const finalLink = baseUrl + catalogSuffix;

            // 4. Отображаем результат
            generatedLink.textContent = finalLink;
            generatedLink.href = finalLink;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
